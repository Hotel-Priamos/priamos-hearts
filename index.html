<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hotel Priamos - Spatial Heart Drop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            text-align: center;
        }
        .camera-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }
        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        
        /* Η καρδιά τοποθετημένη σταθερά σε ένα σημείο του "χώρου" (π.χ. δεξιά και πιο χαμηλά) */
        .spatial-heart {
            position: absolute;
            left: 75%;
            top: 60%;
            width: 100px;
            height: 100px;
            transform: translate(-50%, -50%) scale(0);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            opacity: 0;
        }
        .spatial-heart.visible {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .heart-icon {
            font-size: 70px;
            filter: drop-shadow(0 0 20px rgba(255, 51, 102, 0.9));
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .radar-hint {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 51, 102, 0.4);
            color: #ff99bb;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 20;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }

        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.96);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }
        .start-btn {
            background: #ff3366;
            color: #fff;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(255, 51, 102, 0.5);
        }

        .reveal-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 15, 0.95);
            border: 2px solid #ff3366;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 340px;
            z-index: 50;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 22px; margin-bottom: 8px; color: #fff; }
        p { font-size: 14px; color: #ddd; line-height: 1.4; margin-bottom: 15px; }
        .code-box {
            background: rgba(25, 25, 25, 0.95);
            border: 2px dashed #ff3366;
            padding: 12px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ff3366;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .expired-box {
            background: rgba(15, 15, 15, 0.95);
            border: 2px solid #444;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 320px;
            z-index: 50;
            pointer-events: auto;
        }
        .reset-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 60;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="start-overlay" id="startScreen">
        <div style="font-size: 60px; margin-bottom: 15px;">📷❤️</div>
        <h1>Hotel Priamos Drop</h1>
        <p>Σάρωσε τον χώρο με την κάμερα σου (μετακίνησε το κινητό δεξιά-αριστερά) για να εντοπίσεις την εγκατάσταση.</p>
        <button class="start-btn" onclick="startApp()">Εκκίνηση Κάμερας</button>
    </div>

    <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div class="radar-hint" id="radarHint">🔍 Σάρωσε τον χώρο μετακινώντας το κινητό...</div>
    <div class="ui-layer" id="app"></div>

    <button class="reset-btn" onclick="resetTest()">🔄 Reset Test</button>

    <script>
        const app = document.getElementById('app');
        const videoElement = document.getElementById('webcam');
        const startScreen = document.getElementById('startScreen');
        const radarHint = document.getElementById('radarHint');

        let isDiscovered = false;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                videoElement.srcObject = stream;
            } catch (err) {
                console.log("Camera fallback active.");
            }
        }

        function startApp() {
            startScreen.style.display = 'none';
            initCamera();
            renderApp();

            // Προσομοίωση/Ενεργοποίηση σάρωσης χώρου: 
            // Μετά από λίγες κινήσεις ή αυτόματα με εναλλαγή, ή με αγγίγματα σάρωσης, 
            // κάνουμε την καρδιά να "αποκαλύφθεί" σαν να την βρήκε η κάμερα.
            // Εναλλακτικά, ο χρήστης μπορεί να κάνει swipe/drag στην οθόνη για να ψάξει τον χώρο.
        }

        // Ανίχνευση κίνησης αφής/σάρωσης (Pan/Swipe) για να "σκαγάρει" ο χρήστης τον χώρο στην οθόνη
        let touchStartX = 0;
        window.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
        });

        window.addEventListener('touchmove', e => {
            if (isDiscovered) return;
            let currentX = e.touches[0].clientX;
            let diff = touchStartX - currentX;

            // Αν ο χρήστης σύρει το κινητό/δάχτυλο προς τα αριστερά/δεξιά (σάρωση χώρου)
            if (Math.abs(diff) > 50) {
                revealSpatialHeart();
            }
        });

        // Για δοκιμή και με κλικ/ποντίκι στον υπολογιστή ή απλό άγγιγμα αν δεν γίνει swipe
        function revealSpatialHeart() {
            if (isDiscovered) return;
            isDiscovered = true;
            const heartEl = document.getElementById('spatialHeart');
            if (heartEl) {
                heartEl.classList.add('visible');
                radarHint.innerText = "✨ Εντόπισες την εγκατάσταση! Πάτα την καρδιά!";
            }
        }

        function renderApp() {
            const isClaimed = localStorage.getItem('priamos_space_claimed');
            const isRevealed = localStorage.getItem('priamos_space_revealed');

            if (!isClaimed && !isRevealed) {
                app.innerHTML = `
                    <div class="spatial-heart" id="spatialHeart" onclick="revealCode()">
                        <div class="heart-icon">❤️</div>
                    </div>
                `;
                // Αν θέλεις να εμφανίζεται αυτόματα μόλις περάσουν 2 δευτερόλεπτα σάρωσης:
                setTimeout(() => {
                    if(!isDiscovered) {
                        // Δίνουμε τη δυνατότητα να φανεί με μια μικρή κίνηση ή αυτόματα αν αργεί
                        radarHint.innerText = "👉 Σύρε την οθόνη δεξιά/αριστερά για να ψάξεις...";
                    }
                }, 1500);
            } else if (isRevealed && !isClaimed) {
                radarHint.style.display = 'none';
                app.innerHTML = `
                    <div class="reveal-modal">
                        <div style="font-size: 40px; margin-bottom: 5px;">🎉</div>
                        <h1>Την εντόπισες στον χώρο!</h1>
                        <p>Ήσουν ο πρώτος τυχερός που βρήκες την κρυφή καρδιά στο Hotel Priamos!</p>
                        <div class="code-box">PRIAMOS-HEART-01</div>
                        <p style="font-size: 12px; color: #ff99bb; margin-bottom: 0;">Δείξε αυτή την οθόνη στη ρεσεψιόν. Η εγκατάσταση μόλις εξαφανίστηκε.</p>
                    </div>
                `;
                localStorage.setItem('priamos_space_claimed', 'true');
            } else {
                radarHint.style.display = 'none';
                app.innerHTML = `
                    <div class="expired-box">
                        <div style="font-size: 50px; margin-bottom: 10px;">🖤</div>
                        <h1>Η καρδιά έφυγε!</h1>
                        <p style="color: #aaa; margin-top: 10px; margin-bottom: 0;">Κάποιος άλλος την εντόπισε πρώτος στον χώρο και την πήρε. Η δράση ολοκληρώθηκε!</p>
                    </div>
                `;
            }
        }

        window.revealCode = function() {
            localStorage.setItem('priamos_space_revealed', 'true');
            renderApp();
        }

        window.resetTest = function() {
            localStorage.removeItem('priamos_space_claimed');
            localStorage.removeItem('priamos_space_revealed');
            isDiscovered = false;
            startScreen.style.display = 'flex';
            radarHint.style.display = 'block';
            radarHint.innerText = "🔍 Σάρωσε τον χώρο μετακινώντας το κινητό...";
            renderApp();
        }
    </script>
</body>
</html>
