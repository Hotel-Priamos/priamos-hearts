<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hotel Priamos - Spatial Heart Drop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            text-align: center;
        }
        /* Κάμερα στο background */
        .camera-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* UI Layer */
        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        
        /* Η καρδιά είναι ΜΟΝΙΜΑ ΑΝΑΜΜΕΝΗ και ΣΤΑΘΕΡΗ σε ένα συγκεκριμένο σημείο (π.χ. κάτω δεξιά στην οθόνη) */
        .spatial-heart {
            position: absolute;
            right: 15%;
            bottom: 25%;
            width: 110px;
            height: 110px;
            transform: translate(50%, 50%);
            cursor: pointer;
            pointer-events: auto; /* Επιτρέπει το κλικ/άγγιγμα */
        }

        .heart-icon {
            font-size: 80px;
            filter: drop-shadow(0 0 25px rgba(255, 51, 102, 1));
            animation: pulse 1.2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        .radar-hint {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 51, 102, 0.4);
            color: #ff99bb;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 20;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }

        /* Start Screen */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.96);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }
        .start-btn {
            background: #ff3366;
            color: #fff;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(255, 51, 102, 0.5);
        }

        /* Modal Επιτυχίας */
        .reveal-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 15, 0.95);
            border: 2px solid #ff3366;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 340px;
            z-index: 200;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            text-align: center;
        }
        h1 { font-size: 22px; margin-bottom: 8px; color: #fff; }
        p { font-size: 14px; color: #ddd; line-height: 1.4; margin-bottom: 15px; }
        .code-box {
            background: rgba(25, 25, 25, 0.95);
            border: 2px dashed #ff3366;
            padding: 12px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ff3366;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .expired-box {
            background: rgba(15, 15, 15, 0.95);
            border: 2px solid #444;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 320px;
            z-index: 200;
            pointer-events: auto;
            text-align: center;
        }
        .reset-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 300;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- Οθόνη εκκίνησης για άδεια κάμερας -->
    <div class="start-overlay" id="startScreen">
        <div style="font-size: 60px; margin-bottom: 15px;">❤️</div>
        <h1>Hotel Priamos Drop</h1>
        <p>Εντόπισε την κρυφή καρδιά εγκατάστασης στον χώρο και πάτησέ την!</p>
        <button class="start-btn" onclick="startApp()">Εκκίνηση</button>
    </div>

    <!-- Live κάμερα background -->
    <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <!-- Μηνύματα καθοδήγησης -->
    <div class="radar-hint" id="radarHint">✨ Η καρδιά είναι εγκατεστημένη εδώ!</div>
    
    <!-- UI Layer με τη σταθερή καρδιά -->
    <div class="ui-layer" id="app"></div>

    <button class="reset-btn" onclick="resetTest()">🔄 Reset Test</button>

    <script>
        const app = document.getElementById('app');
        const videoElement = document.getElementById('webcam');
        const startScreen = document.getElementById('startScreen');
        const radarHint = document.getElementById('radarHint');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                videoElement.srcObject = stream;
            } catch (err) {
                console.log("Camera fallback active.");
            }
        }

        function startApp() {
            startScreen.style.display = 'none';
            initCamera();
            renderApp();
        }

        function renderApp() {
            const isClaimed = localStorage.getItem('priamos_static_claimed');
            const isRevealed = localStorage.getItem('priamos_static_revealed');

            if (!isClaimed && !isRevealed) {
                app.innerHTML = `
                    <div class="spatial-heart" id="spatialHeart" onclick="revealCode()">
                        <div class="heart-icon">❤️</div>
                    </div>
                `;
                radarHint.style.display = 'block';
                radarHint.innerText = "✨ Η καρδιά είναι σταθερά εδώ! Πάτα την.";
            } else if (isRevealed && !isClaimed) {
                radarHint.style.display = 'none';
                app.innerHTML = `
                    <div class="reveal-modal">
                        <div style="font-size: 40px; margin-bottom: 5px;">🎉</div>
                        <h1>Την εντόπισες στον χώρο!</h1>
                        <p>Ήσουν ο τυχερός που βρήκε την κρυφή καρδιά στο Hotel Priamos!</p>
                        <div class="code-box">PRIAMOS-HEART-01</div>
                        <p style="font-size: 12px; color: #ff99bb; margin-bottom: 0;">Δείξε αυτή την οθόνη στη ρεσεψιόν. Η εγκατάσταση μόλις εξαφανίστηκε.</p>
                    </div>
                `;
                localStorage.setItem('priamos_static_claimed', 'true');
            } else {
                radarHint.style.display = 'none';
                app.innerHTML = `
                    <div class="expired-box">
                        <div style="font-size: 50px; margin-bottom: 10px;">🖤</div>
                        <h1>Η καρδιά έφυγε!</h1>
                        <p style="color: #aaa; margin-top: 10px; margin-bottom: 0;">Κάποιος άλλος την εντόπισε πρώτος στον χώρο και την πήρε. Η δράση ολοκληρώθηκε!</p>
                    </div>
                `;
            }
        }

        window.revealCode = function() {
            localStorage.setItem('priamos_static_revealed', 'true');
            renderApp();
        }

        window.resetTest = function() {
            localStorage.removeItem('priamos_static_claimed');
            localStorage.removeItem('priamos_static_revealed');
            startScreen.style.display = 'flex';
            renderApp();
        }
    </script>
</body>
</html>
