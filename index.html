<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hotel Priamos - Spatial AR Heart</title>
    <!-- Φόρτωση A-Frame και AR.js για σταθερή τοποθέτηση στον χώρο -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .radar-hint {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 51, 102, 0.4);
            color: #ff99bb;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 9999;
            pointer-events: none;
            backdrop-filter: blur(5px);
            text-align: center;
        }
        /* Modal Αποκάλυψης */
        .reveal-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 15, 0.95);
            border: 2px solid #ff3366;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 340px;
            z-index: 10000;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            color: #fff;
            display: none;
        }
        h1 { font-size: 22px; margin-bottom: 8px; }
        p { font-size: 14px; color: #ddd; line-height: 1.4; margin-bottom: 15px; }
        .code-box {
            background: rgba(25, 25, 25, 0.95);
            border: 2px dashed #ff3366;
            padding: 12px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ff3366;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .reset-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 10000;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div class="radar-hint" id="radarHint">🎯 Στρέψτε την κάμερα στον χώρο. Η καρδιά είναι σταθερά εγκατεστημένη μπροστά σας!</div>

    <!-- Modal Επιτυχίας -->
    <div class="reveal-modal" id="revealModal">
        <div style="font-size: 40px; margin-bottom: 5px;">🎉</div>
        <h1>Την εντόπισες στον χώρο!</h1>
        <p>Ήσουν ο τυχερός που βρήκε την κρυφή καρδιά εγκατάστασης στο Hotel Priamos!</p>
        <div class="code-box">PRIAMOS-HEART-01</div>
        <p style="font-size: 12px; color: #ff99bb; margin-bottom: 0;">Δείξε αυτή την οθόνη στη ρεσεψιόν.</p>
    </div>

    <button class="reset-btn" onclick="resetTest()">🔄 Reset Test</button>

    <!-- AR Scene -->
    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false; gpsEnabled: false;">
        
        <!-- Κάμερα Χρήστη -->
        <a-camera gps-camera rotation-reader></a-camera>

        <!-- Σταθερό 3D Αντικείμενο (Καρδιά) τοποθετημένο ακριβώς μπροστά στον χώρο -->
        <!-- Θέση: x (δεξιά/αριστερά), y (ύψος), z (απόσταση μπροστά) -->
        <a-entity id="spatialHeart" position="0 0 -2" scale="0.8 0.8 0.8" class="clickable" onclick="revealCode()">
            <!-- 3D Text ή Σχήμα Καρδιάς (HTML/Plane με Emoji ή Εικόνα) -->
            <a-plane width="1.2" height="1.2" material="transparent: true; opacity: 0;"></a-plane>
            <a-text value="❤️" align="center" scale="3 3 3" color="#ff3366"></a-text>
        </a-entity>

    </a-scene>

    <script>
        function revealCode() {
            const isClaimed = localStorage.getItem('priamos_ar_claimed');
            if (isClaimed) return;

            localStorage.getItem('priamos_ar_claimed', 'true');
            document.getElementById('revealModal').style.display = 'block';
            document.getElementById('radarHint').style.display = 'none';
            document.getElementById('spatialHeart').style.display = 'none';
        }

        window.resetTest = function() {
            localStorage.removeItem('priamos_ar_claimed');
            location.reload();
        }

        // Έλεγχος αν έχει ήδη ληφθεί
        window.onload = function() {
            if (localStorage.getItem('priamos_ar_claimed')) {
                document.getElementById('revealModal').style.display = 'block';
                document.getElementById('radarHint').style.display = 'none';
                document.getElementById('spatialHeart').style.display = 'none';
            }
        }
    </script>
</body>
</html>
